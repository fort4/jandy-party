name: Daily Auto Commit

on:
  schedule:
    # UTC 기준 설정: 한국 시간(KST = UTC+9) 기준 매일 09:00, 15:00, 21:00 실행
    # (UTC 기준: 00:00, 06:00, 12:00)
    - cron: '0 0,6,12 * * *'
  workflow_dispatch: # 수동 테스트를 위한 트리거

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 리포지토리에 푸시할 수 있는 권한 부여
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          # 커밋할 변경 사항 생성 (UTC 타임스탬프 기록)
          date -u > auto-commit.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add auto-commit.txt
          git commit -m "Auto commit: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
