name: Daily Auto Commit

on:
  schedule:
    # 한국 시간(KST) 기준 09:00, 15:00, 21:00 실행 (UTC 기준 00:00, 06:00, 12:00)
    - cron: '0 0,6,12 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 테스트가 가능하도록 설정

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update commit log
        run: |
          # jandy-party 리포지토리에 타임스탬프 기록
          echo "Last run: $(date -u)" >> commit-log.txt

      - name: Commit and Push
        run: |
          git config --global user.name "fort4"
          git config --global user.email "fort4@users.noreply.github.com"
          git add commit-log.txt
          git commit -m "chore: auto jandy update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
